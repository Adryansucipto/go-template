run:
  timeout: 5m
  modules-download-mode: readonly

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  errcheck:
    check-type-assertions: true
    check-blank: false
  gocyclo:
    min-complexity: 25

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

issues:
  exclude-dirs:
    - docs
    - proto
    - tmp
    - bin
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

