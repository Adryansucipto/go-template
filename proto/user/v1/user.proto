syntax = "proto3";

package user.v1;

option go_package = "go-template/proto/user/v1;userv1";

service UserService {
  rpc GetUsers (GetUsersRequest) returns (GetUsersResponse);
}

message GetUsersRequest {}

message UserItem {
  int32 id = 1;
  string name = 2;
  string username = 3;
}

message GetUsersResponse {
  repeated UserItem users = 1;
}

