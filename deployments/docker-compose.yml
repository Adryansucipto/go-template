services:
  postgres:
    image: postgres:16-alpine
    container_name: go_template_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_template_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-go_template_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: go_template_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: redpandadata/redpanda:v24.1.1
    container_name: go_template_kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://kafka:29092,external://localhost:9092
      - --smp 1
      - --memory 512M
      - --mode dev-container
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: go_template_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: go_template_api
    entrypoint: ["/app/bin/api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: ${PORT:-9001}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      API_KEY: ${API_KEY:-internal-secret-api-key-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-go_template_db}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-go-template-consumer-group}
    ports:
      - "${PORT:-9001}:9001"

  grpc:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: go_template_grpc
    entrypoint: ["/app/bin/grpc"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      GRPC_PORT: ${GRPC_PORT:-9002}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      API_KEY: ${API_KEY:-internal-secret-api-key-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-go_template_db}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-go-template-consumer-group}
    ports:
      - "${GRPC_PORT:-9002}:9002"

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: go_template_worker
    entrypoint: ["/app/bin/worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      API_KEY: ${API_KEY:-internal-secret-api-key-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-go_template_db}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-go-template-consumer-group}

  scheduler:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: go_template_scheduler
    entrypoint: ["/app/bin/scheduler"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-me}
      API_KEY: ${API_KEY:-internal-secret-api-key-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-go_template_db}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-go-template-consumer-group}

volumes:
  pgdata:
