app:
  env: dev
  port: "9001"
  base-path: go-template

grpc:
  port: "9002"

jwt:
  secret: change-me-in-production

api_key:
  enabled: true
  header: "X-API-Key"
  key: default-internal-api-key-change-me
  clients:
    payment_service: payment-service-secret-key
    notification_service: notification-service-secret-key

database:
  postgreSql:
    driver: postgresql
    username: postgres
    password: postgres
    host: localhost
    port: "5432"
    name: go_template_db
    schema: public
    sslmode: disable
    max_idle_conns: 10
    max_open_conns: 100
    conn_max_lifetime_minutes: 60

redis:
  enabled: true
  host: localhost
  port: "6379"
  password: ""
  db: 0
  default_ttl_minutes: 10

kafka:
  enabled: true
  brokers: localhost:9092
  group_id: go-template-consumer-group
  max_retries: 3
  retry_backoff_ms: 500
  dlq_topic_suffix: ".dlq"
  event_queue_batch_size: 50

scheduler:
  enabled: true
  timezone: "Asia/Jakarta"
  jobs:
    event_queue_relay:
      enabled: true
      cron: "@every 5s"
      batch_size: 50
    cleanup_expired_sessions:
      enabled: true
      cron: "*/15 * * * *" # Setiap 15 menit (format standard cron: menit jam tanggal bulan hari)

client:
  timeout_seconds: 10
  services:
    partner_service:
      base_url: http://localhost:9001
      grpc_addr: localhost:9002
      api_key: default-internal-api-key-change-me
      timeout_seconds: 5
