app:
  env: prod
  port: "${PORT}"
  base-path: go-template

jwt:
  secret: ${JWT_SECRET}

database:
  postgreSql:
    driver: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    host: ${DB_HOST}
    port: "${DB_PORT}"
    name: ${DB_NAME}
    schema: ${DB_SCHEMA}
    sslmode: require
    max_idle_conns: 20
    max_open_conns: 100
    conn_max_lifetime_minutes: 60

kafka:
  enabled: true
  brokers: ${KAFKA_BROKERS}
  group_id: ${KAFKA_GROUP_ID}
  max_retries: 5
  retry_backoff_ms: 1000
  dlq_topic_suffix: ".dlq"
  outbox_batch_size: 100

scheduler:
  enabled: true
  timezone: "Asia/Jakarta"
  jobs:
    outbox_relay:
      enabled: true
      cron: "@every 3s"
      batch_size: 100
    cleanup_expired_sessions:
      enabled: true
      cron: "0 * * * *" # Setiap 1 jam sekali (menit ke-0)
